spring:
  config:
    activate:
      on-profile: "h2"
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:localDB;MODE=MYSQL
    username: sa
    password:
  jpa:
    defer-datasource-initialization: true # data.sql 읽기
    hibernate:
      ddl-auto: create  # 개발환경에서만 create 사용하기

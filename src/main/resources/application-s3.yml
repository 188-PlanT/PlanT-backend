spring:
  config:
    activate:
      on-profile: "s3"
  servlet:
    multipart:
      maxFileSize: 10MB
      maxRequestSize: 10MB

#AWS
cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET}
    credentials:
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
    region:
      static: ${S3_REGION}
    stack:
      auto: false
